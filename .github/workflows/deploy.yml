name: Deploy Angular no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar Angular
        run: npm run build -- --base-href /Lion-School-Angular/

      - name: Enviar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/lion-school-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4