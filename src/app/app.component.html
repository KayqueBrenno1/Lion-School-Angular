<header id="header">
  <div class="top">
    <img src="img/logo.png" alt="Logo Lion School">
    <div class="out" (click)="onVoltarClick()">
      <img src="img/sair.png" alt="Ícone de sair/voltar">
      <span>{{ textoVoltar }}</span>
    </div>
  </div>
</header>

<main id="main" [ngClass]="mainClass">
  <router-outlet />
</main>

<footer>
  <div class="frame">
    <div class="info">
      <div class="icons">
        <img src="img/phone.png" alt="Ícone de telefone">
        <img src="img/email.png" alt="Ícone de email">
        <img src="img/local.png" alt="Ícone de local">
      </div>
      <div class="data">
        <span class="phone">(11) 4774-4700</span>
        <span class="email">lionschool&#64;gmail.com</span>
        <span class="local">Rua TCC, 211, Centro, Jandira</span>
      </div>
    </div>
    <div class="copyright">
      <span>Copyright © 2026 | Fernando Leonid</span>
    </div>
    <div class="social-media">
      <div class="border"><img src="img/youtube.png" alt="Ícone do Youtube"></div>
      <div class="border"><img src="img/twitter.png" alt="Ícone do Twitter"></div>
      <div class="border"><img src="img/instagram.png" alt="Ícone do Instagram"></div>
      <div class="border"><img src="img/facebook.png" alt="Ícone do Facebook"></div>
    </div>
  </div>
</footer>
